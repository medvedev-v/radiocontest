services:
  radiocontest:
    build: 
      context: ./
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    depends_on:
      - mysql
    ports: 
      - "8080:8080"
    environment:
      - DB_VENDOR=mysql
      - DB_USER=radiocontest
      - DB_PASSWORD=radiocontest
      - DB_NAME=radiocontest
    volumes:
      - ./backend/:/app
    #restart: always
  mysql:
    image: percona:8.0.15-5-centos
    ports:
      - "33066:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: radiocontest
      MYSQL_DATABASE: radiocontest
      LANG: ru_RU.UTF-8
    #restart: always
    
services:
  radiocontest:
    build:
      context: ./
      dockerfile: docker/backend/Dockerfile
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - DB_VENDOR=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=radiocontest
      - DB_PASSWORD=radiocontest
      - DB_NAME=radiocontest
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: radiocontest
      POSTGRES_PASSWORD: radiocontest
      POSTGRES_DB: radiocontest
      LANG: ru_RU.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocontest"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
